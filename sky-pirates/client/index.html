<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes, planes, and more planes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #1b1b1b;
      overflow: hidden;
      height: 100%;
      /* Disable tap highlight */
      -webkit-tap-highlight-color: transparent;
      /* Prevent default touch actions (scroll/zoom) for better game response */
      touch-action: none;
    }
    input, textarea {
      /* Re-enable selection for text inputs */
      -webkit-user-select: text;
      -khtml-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
    #mobileChatContainer {
      display: none;
      position: fixed;
      bottom: 0px;
      left: 0;
      width: 100%;
      height: 50px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.8);
      padding: 5px;
      box-sizing: border-box;
      /* Flexbox logic for mobile layout */
      justify-content: space-between;
      align-items: center;
      gap: 5px; 
    }
    #mobileChatInput {
      flex-grow: 1; /* Take remaining space */
      width: auto; /* Let flex handle width */
      height: 100%;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      padding: 0 10px;
    }
    #mobileChatSend {
      width: 80px; /* Fixed width for button */
      flex-shrink: 0; /* Don't shrink */
      height: 100%;
      margin-left: 0; /* Handled by gap */
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
  </style>
  <script src="p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/msgpack-lite/dist/msgpack.min.js"></script>

  <script src="Particle.js?v=A.1758731.5925"></script>
  <script src="Cloud.js?v=A.1758731.5925"></script>
  <script src="Prediction.js?v=A.1758800.000000"></script>
  <script src="Game.js?v=A.1758738.288439"></script>
  <script src="MapDraw.js?v=A.1755899.329789"></script>
  <script src="Display.js?v=A.1758739.353639"></script>
  <script src="Controls.js?v=A.1758738.288450"></script>
  <script src="ServerMessaging.js?v=A.1758733.719292"></script>
  <script src="Menu.js?v=A.1758650.174608"></script>
  <script src="Item.js?v=A.1755899.329789"></script>
  <script src="Inventory.js?v=A.1755899.329789"></script>
  <script src="HelpWindow.js?v=A.1757088.339997"></script>

  <script>
    // window.WS_ADDRESS = 'ws://localhost:8080/ws/';
    // Use wss:// for HTTPS and ws:// for HTTP, and /ws/ path for nginx proxy
    window.WS_ADDRESS = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws/';
  </script>

</head>

<body>
  <div id="mobileChatContainer">
    <input type="text" id="mobileChatInput" placeholder="Type message..." autocomplete="off">
    <button id="mobileChatSend">Send</button>
  </div>
</body>

</html>

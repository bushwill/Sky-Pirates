server {
    listen 8080;

    location = / {
        root /usr/src/app;
        try_files /landingpage/landing.html =404;
    }

    location /images/ {
        alias /usr/src/app/landingpage/images/;
    }

    location /skypirates {
        alias /usr/src/app/;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /usr/src/app/selfsigned.crt;
    ssl_certificate_key /usr/src/app/selfsigned.key;

    location = / {
        root /usr/src/app;
        try_files /landingpage/landing.html =404;
    }

    location /images/ {
        alias /usr/src/app/landingpage/images/;
    }

    location /skypirates {
        alias /usr/src/app/;
        try_files $uri $uri/ /index.html;
    }
}

server {
    location /ws/ {
        proxy_pass http://server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 8080;

    location = / {
        root /usr/src/app;
        try_files /landingpage/landing.html =404;
    }

    location /images/ {
        alias /usr/src/app/landingpage/images/;
    }

    location /skypirates {
        alias /usr/src/app/;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /usr/src/app/certs/selfsigned.crt;
    ssl_certificate_key /usr/src/app/certs/selfsigned.key;
        location /ws/ {
            proxy_pass http://server:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    location = / {
        root /usr/src/app;
        try_files /landingpage/landing.html =404;
    }

    location /images/ {
        alias /usr/src/app/landingpage/images/;
    }

    location /skypirates {
        alias /usr/src/app/;
        try_files $uri $uri/ /index.html;
    }
}

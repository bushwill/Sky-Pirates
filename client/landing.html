<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>William Bushell - Landing Page</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: #fff;
        font-family: Segoe UI, Arial, sans-serif;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5em;
        text-align: center;
      }
      .button {
        display: inline-block;
        padding: 1em 2em;
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #ff9800 0%, #2196f3 100%);
        border: none;
        border-radius: 30px;
        text-decoration: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        transition: background 0.3s, transform 0.2s;
        margin-top: 2em;
      }
      .button:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <h1>William Bushell</h1>
  <h2 style="text-align: center; font-weight: 400;">Research Student, University of Saskatchewan</h2>
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 2em;">
      <span id="pc-warning" style="display:none; font-size:1rem; color:#ffd700; font-weight:600; margin-bottom: 1em;">Only supported for PC</span>
      <a href="/skypirates/" class="button">Go to Sky Pirates</a>
    </div>
    <script>
      // Show warning if not on a PC (Windows, Mac, Linux)
      const isPC = /Windows|Macintosh|Linux/i.test(navigator.userAgent);
      if (!isPC) {
        document.getElementById('pc-warning').style.display = 'inline';
      }
    </script>
  </body>
</html>

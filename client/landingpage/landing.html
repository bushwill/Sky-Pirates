<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>William Bushell - Landing Page</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            font-family: Segoe UI, Arial, sans-serif;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5em;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 1em 2em;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #2196f3 0%, #2196f3 100%);
            border: none;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: background 0.3s, transform 0.2s;
            margin-top: 2em;
        }

        .button.sp {
            background: linear-gradient(90deg, #ff9800 0%, #2196f3 100%);
        }

        .button.green {
            background: linear-gradient(90deg, #000 0%, #00ff00 100%);
        }

        .button.green:hover {
            background: linear-gradient(90deg, #000 0%, #00ff00 100%);
            transform: scale(1.05);
        }

        .button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div id="carousel"
        style="width:100%; max-width:300px; height:300px; margin: 2em auto 1em auto; display:flex; justify-content:center; align-items:center; overflow:hidden;">
        <img id="carousel-img" alt="carousel"
            style="width:300px; height:300px; object-fit:cover; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.15);">
    </div>
    <h1>Thanks for visiting my website!</h1>
    <div style="text-align: center; font-weight: 400;">-William Bushell, University of Saskatchewan</h2>
        <div style="display: flex; flex-direction: column; align-items: center; margin-top: 2em;">
            <span id="pc-warning"
                style="display:none; font-size:1rem; color:#ffd700; font-weight:600; margin-bottom: 1em;">Sky Pirates
                only supported for keyboard/mouse</span>
            <a href="/skypirates/" class="button sp">Go to Sky Pirates</a>
            <a id="port81-btn" class="button green" style="margin-top:1em;">Go to L-system plant examples</a>
        </div>
        <script>
            // Rotating carousel images
            var images = [
                "images/bigfatbird.jpeg",
                "images/gambled.jpeg",
                "images/jesusfire.jpeg",
                "images/meandthem.jpeg",
                "images/ppstance.jpeg",
                "images/triumphant.jpeg"
            ];
            // randomize images 
            for (let i = images.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [images[i], images[j]] = [images[j], images[i]];
            }
            var idx = 0;
            var carouselImg = document.getElementById('carousel-img');
            carouselImg.src = images[idx]; // Show first image immediately
            setInterval(function () {
                idx = (idx + 1) % images.length;
                carouselImg.src = images[idx];
            }, 2500);

            // Show warning if not on a PC (Windows, Mac, Linux)
            var isPC = /Windows|Macintosh|Linux/i.test(navigator.userAgent);
            if (!isPC) {
                document.getElementById('pc-warning').style.display = 'inline';
            }
            // Set port 81 button to use current hostname
            document.getElementById('port81-btn').href = window.location.protocol + '//' + window.location.hostname + ':81';
        </script>

</body>

</html>

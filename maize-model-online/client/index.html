<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="build-version" content="A.68">
  <title>L-System Playground</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1b1b1b;
    }
  
    #instructions {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      font-family: sans-serif;
      font-size: 16px;
      color: white;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }

    #instructions .mobile-instructions {
      display: none;
    }

    @media (pointer: coarse) {
      #instructions .desktop-instructions {
        display: none;
      }

      #instructions .mobile-instructions {
        display: inline;
      }
    }
  </style>
  <script src="/maizemodel/p5.min.js?v=A.68"></script>

  <script src="/maizemodel/App.js?v=A.68"></script>
</head>

<body>
  <div id="instructions">
    <span class="desktop-instructions">Click and drag to rotate, scroll to zoom</span>
    <span class="mobile-instructions">Drag to rotate/zoom</span>
  </div>
</body>

</html>

services:
  client:
    build:
      context: ./sky-pirates/client
    ports:
      - "80:8080"
      - "443:443"
    environment:
      SERVER_HOST: server
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

  landingpage:
    build:
      context: ./landingpage
    # No external ports - accessed via client proxy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
      
  server:
    build:
      context: ./sky-pirates/server  
    ports:
      - "3000:3000"
    volumes:
      - ./sky-pirates/server/database:/usr/src/app/database
    deploy:
      resources:
        limits:
          memory: 1500M
          cpus: '1.75'

  jet-game:
    build:
      context: ./jet-game/client
    # No external ports - accessed via client proxy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    
  maize-model:
    build:
      context: ./maize-model-online
    # No external ports - accessed via client proxy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

services:
  client:
    build:
      context: ./sky-pirates/client
    ports:
      - "80:8080"
      - "443:443"
    environment:
      SERVER_HOST: server

  landingpage:
    build:
      context: ./landingpage
    # No external ports - accessed via client proxy
      
  server:
    build:
      context: ./sky-pirates/server  
    ports:
      - "3000:3000"
    volumes:
      - ./sky-pirates/server:/server

  jet-game:
    build:
      context: ./jet-game/client
    # No external ports - accessed via client proxy

  jet-game-server:
    build:
      context: ./jet-game/server
    ports:
      - "3001:3001"
    # WebSocket server for jet-game scoreboard
    
  maize-model:
    build:
      context: ./maize-model-online
    # No external ports - accessed via client proxy

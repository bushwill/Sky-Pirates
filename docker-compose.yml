services:
  client:
    build:
      context: ./client
    ports:
      - "80:8080"
      - "443:443"
    environment:
      SERVER_HOST: server
      
  server:
    build:
      context: ./server  
    ports:
      - "3000:3000"
    volumes:
      - ./server:/server

  jet-game:
    build:
      context: ./jet-game
    # No external ports - accessed via client proxy
    volumes:
      - ./jet-game/nginx.conf:/etc/nginx/nginx.conf
      - ./jet-game/certs:/usr/src/app/certs
    
  maize-model:
    build:
      context: ./maize-model-online
    # No external ports - accessed via client proxy
    volumes:
      - ./maize-model-online/nginx.conf:/etc/nginx/nginx.conf
      - ./maize-model-online/certs:/usr/src/app/certs
